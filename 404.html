    <main class="container error-page">

                <img src="images/404.png" alt="404 - Page Not Found" onerror="this.style.display='none'">

            <h1 class="error-title">404</h1>
            <h2 class="error-subtitle">Page Not Found</h2>
            <p class="error-message">Oops! The page you're looking for doesn't exist.</p>
            <p class="error-suggestion">It may have been moved or deleted, or you may have mistyped the URL.</p>
            <div class="error-actions">
                <a href="index.html" class="btn btn-primary">Go to Home</a>
                <a href="research.html" class="btn btn-secondary">View Research</a>

        </div>
